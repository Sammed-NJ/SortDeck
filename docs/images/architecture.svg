<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <title>SortDeck architecture: sandboxed renderer, preload bridge, main process, Windows</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d8590"/>
    </marker>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22a6c3"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
  </defs>

  <rect width="960" height="600" rx="18" fill="#17191c"/>

  <!-- renderer -->
  <rect x="40" y="28" width="880" height="160" rx="16" fill="#1b1e22" stroke="#2c3036" stroke-width="1.5"/>
  <text x="480" y="56" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.6" fill="#22a6c3">RENDERER  ·  SANDBOXED  ·  CONTEXT ISOLATION  ·  STRICT CSP</text>
  <g font-size="12.5" fill="#9aa1ab" text-anchor="middle">
    <rect x="60" y="74" width="195" height="94" rx="12" fill="#1f2226" stroke="#3a4048"/>
    <text x="157" y="104" font-size="15" font-weight="600" fill="#e6e8eb">app.js</text>
    <text x="157" y="126">helpers, navigation</text>
    <text x="157" y="144">overview, settings, save</text>

    <rect x="275" y="74" width="195" height="94" rx="12" fill="#1f2226" stroke="#3a4048"/>
    <text x="372" y="104" font-size="15" font-weight="600" fill="#e6e8eb">folders.js</text>
    <text x="372" y="126">folder list, add dialog</text>
    <text x="372" y="144">schedule, file-type groups</text>

    <rect x="490" y="74" width="195" height="94" rx="12" fill="#1f2226" stroke="#3a4048"/>
    <text x="587" y="104" font-size="15" font-weight="600" fill="#e6e8eb">rules.js</text>
    <text x="587" y="126">rule list and editor</text>
    <text x="587" y="144">Organize now / preview</text>

    <rect x="705" y="74" width="195" height="94" rx="12" fill="#1f2226" stroke="#3a4048"/>
    <text x="802" y="104" font-size="15" font-weight="600" fill="#e6e8eb">tutorial.js</text>
    <text x="802" y="126">walk-through dialog</text>
    <text x="802" y="144">starter rules for Downloads</text>
  </g>

  <!-- bridge -->
  <line x1="480" y1="190" x2="480" y2="222" stroke="#7d8590" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <rect x="290" y="226" width="380" height="50" rx="14" fill="url(#accent)"/>
  <text x="480" y="249" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">preload.js  ·  window.api</text>
  <text x="480" y="267" text-anchor="middle" font-size="12" fill="#d8f3f8">the page's only door to the app (contextBridge + IPC)</text>
  <line x1="480" y1="278" x2="480" y2="308" stroke="#7d8590" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- main -->
  <rect x="40" y="312" width="880" height="160" rx="16" fill="#1b1e22" stroke="#2c3036" stroke-width="1.5"/>
  <text x="480" y="340" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.6" fill="#22a6c3">MAIN PROCESS  ·  WINDOW, TRAY, IPC</text>
  <g font-size="12" fill="#9aa1ab" text-anchor="middle">
    <rect x="60" y="358" width="156" height="94" rx="12" fill="#1f2226" stroke="#3a4048"/>
    <text x="138" y="388" font-size="15" font-weight="600" fill="#e6e8eb">main.js</text>
    <text x="138" y="410">window, tray, login</text>
    <text x="138" y="428">IPC, uninstall</text>

    <rect x="231" y="358" width="156" height="94" rx="12" fill="#1f2226" stroke="#3a4048"/>
    <text x="309" y="388" font-size="15" font-weight="600" fill="#e6e8eb">config.js</text>
    <text x="309" y="410">validate, load, save</text>
    <text x="309" y="428">backup + restore</text>

    <rect x="402" y="358" width="156" height="94" rx="12" fill="#1f2226" stroke="#34d399"/>
    <text x="480" y="388" font-size="15" font-weight="600" fill="#e6e8eb">engine.js</text>
    <text x="480" y="410">watch, match rules</text>
    <text x="480" y="428">move / copy / recycle</text>

    <rect x="573" y="358" width="156" height="94" rx="12" fill="#1f2226" stroke="#3a4048"/>
    <text x="651" y="388" font-size="15" font-weight="600" fill="#e6e8eb">doctor.js</text>
    <text x="651" y="410">troubleshoot</text>
    <text x="651" y="428">check + repair</text>

    <rect x="744" y="358" width="156" height="94" rx="12" fill="#1f2226" stroke="#3a4048"/>
    <text x="822" y="388" font-size="15" font-weight="600" fill="#e6e8eb">update.js</text>
    <text x="822" y="410">GitHub Releases</text>
    <text x="822" y="428">version compare</text>
  </g>
  <text x="480" y="490" text-anchor="middle" font-size="12" fill="#7d8590">config, engine, doctor and update have no Electron imports - tested with plain Node</text>

  <!-- outside world -->
  <line x1="480" y1="498" x2="480" y2="520" stroke="#7d8590" stroke-width="2" marker-end="url(#arrow)"/>
  <g font-size="13" font-weight="600" text-anchor="middle">
    <rect x="60" y="526" width="195" height="48" rx="12" fill="#272b30"/>
    <text x="157" y="555" fill="#e6e8eb">Your folders (fs)</text>
    <rect x="275" y="526" width="195" height="48" rx="12" fill="#272b30"/>
    <text x="372" y="555" fill="#e6e8eb">Recycle Bin</text>
    <rect x="490" y="526" width="195" height="48" rx="12" fill="#272b30"/>
    <text x="587" y="555" fill="#e6e8eb">Notifications · tray</text>
    <rect x="705" y="526" width="195" height="48" rx="12" fill="#272b30"/>
    <text x="802" y="550" fill="#e6e8eb">GitHub Releases</text>
    <text x="802" y="566" font-size="11" font-weight="400" fill="#9aa1ab">only when you click</text>
  </g>
</svg>
